name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Catalog and repo guards
        run: python -m unittest discover -v

      - name: Manifest is valid JSON with a release version
        run: python -c "import json,re; m=json.load(open('manifest.json')); assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', m['version']), m['version']; print(m['id'], m['version'])"
